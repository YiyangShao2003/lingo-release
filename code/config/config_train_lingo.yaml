defaults:
  - dataset: lingo
  - guidance:
      - pelvis
  - model:
      - synhsi_body
  - sampler:
      - pelvis
  - _self_

model:
  synhsi_body:
    language_feature_dim: 768  # Will be set to 64 if use_lang_vae is true

# Language VAE settings
use_lang_vae: true
lang_vae_ckpt: ${oc.env:ROOT_DIR}/results/lang_vae/checkpoints/lang_vae_bs128_lr0.0001_ld64_2025-11-17_16-08/best.pth

exp_name: test
train: true
load_state_dict: false
batch_size: 128
lr: 0.0001
epochs: 1000
device: cuda:0
ckpt_name: None
use_tensorboard: false
use_wandb: true
wandb_project: lingo-training
ckpt_interval: 5

exp_dir: ${oc.env:ROOT_DIR}/results/${exp_name}
smpl_dir: ${oc.env:ROOT_DIR}/smpl_models

num_gpus: 1
num_workers: 8
scene_type: occ_two
max_window_size: 16
motion_len: 100000
vis: false
start_type: stand

load_language: true
load_scene: true
use_pi: false
load_hand_goal: true
load_pelvis_goal: true
auto_regre_num: 2

ckpt_path: None

hydra:
  run:
    dir: ${exp_dir}