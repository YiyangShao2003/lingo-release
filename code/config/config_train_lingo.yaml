defaults:
  - dataset: lingo
  - guidance:
      - pelvis
  - model:
      - synhsi_body
  - sampler:
      - pelvis
  - _self_

model:
  synhsi_body:
    language_feature_dim: 768

exp_name: test
train: true
load_state_dict: false
batch_size: 128
lr: 0.0001
epochs: 1000
device: cuda:0
ckpt_name: None
use_tensorboard: false
use_wandb: true
wandb_project: lingo-training
ckpt_interval: 5

exp_dir: ${oc.env:ROOT_DIR}/results/${exp_name}
smpl_dir: ${oc.env:ROOT_DIR}/smpl_models

num_gpus: 1
num_workers: 8
scene_type: occ_two
max_window_size: 16
motion_len: 100000
vis: false
start_type: stand

load_language: true
load_scene: true
use_pi: false
load_hand_goal: true
load_pelvis_goal: true
auto_regre_num: 2

# Sampler settings (for training, DDPM is standard)
sampler_type: ddpm  # 'ddpm' or 'ddim'
ddim_steps: 20  # Only used if sampler_type='ddim'

latent:
  dim: 64
  use_cached: false  # Set to false for vanilla diffusion
  cache_root: ${oc.env:ROOT_DIR}/cache/latents
  encode_batch_size: 128
  cache_num_workers: 4
  dtype: float16
  cache_path: null

vae:
  model:
    _target_: models.latent_vae.MotionVAE
    input_dim: ${times:${dataset.nb_joints},3}
    latent_dim: ${latent.dim}
    hidden_dim: 512
    dropout_p: 0.1
  ckpt_path: ${oc.env:ROOT_DIR}/results/vae_motion/checkpoints/vae_best.pth

ckpt_path: None

hydra:
  run:
    dir: ${exp_dir}